<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PertanianKu - Aplikasi Petani Cerdas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #2c5f2d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
            height: 100vh;
            background: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .pages-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .page {
            display: none;
            width: 100%;
            min-height: 100%;
            animation: slideIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .scroll-area {
            height: calc(100% - 70px);
            overflow-y: auto;
            padding: 20px;
        }

        .close-btn, .back-btn {
            background: rgba(0,0,0,0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: black;
            font-weight: bold;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: inherit;
            z-index: 10;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid black;
        }

        .sticky-header h2 {
            flex: 1;
            font-size: 18px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            max-width: 450px;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 10px;
            margin: 0 5px;
        }

        .nav-item.active {
            background: black;
        }

        .nav-item.active .nav-label,
        .nav-item.active .nav-icon {
            color: white;
        }

        .nav-icon {
            font-size: 24px;
            color: black;
        }

        .nav-label {
            font-size: 12px;
            color: black;
        }

        /* HOME PAGE */
        .home-header {
            background: #B8E1FF;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid black;
        }

        .home-header h1 {
            color: #8B4513;
            font-size: 24px;
        }

        .tutorial-icon {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .home-middle {
            background: #8B4513;
            min-height: calc(100vh - 140px);
            padding: 40px 20px;
        }

        .features-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .feature-btn {
            background: #90EE90;
            border: none;
            border-radius: 15px;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #32CD32;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .feature-btn:hover {
            transform: translateY(-2px);
        }

        /* KALKULATOR */
        .calculator-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #4A90D9;
        }

        .calculator-header {
            background: #4A90D9;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid black;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .calculator-header h2 {
            color: red;
            flex: 1;
        }

        .calculator-screen {
            background: black;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 120px;
        }

        .history-input {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            text-align: right;
            min-height: 20px;
        }

        .current-input {
            color: white;
            font-size: 42px;
            text-align: right;
            font-weight: bold;
            word-wrap: break-word;
        }

        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .calc-btn {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            font-weight: bold;
        }

        .calc-btn.operator {
            background: #4CAF50;
            color: white;
        }

        .calc-btn.equals {
            background: #ffa500;
            color: white;
        }

        .calc-btn.function {
            background: #ddd;
        }

        .unit-section {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .unit-title {
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .unit-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .unit-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            min-width: 55px;
        }

        /* LAYER 2 */
        .layer2-header {
            background: #B8E1FF;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid black;
        }

        .layer2-header h2 {
            color: #8B4513;
            flex: 1;
        }

        .layer2-content {
            background: #2E7D32;
            min-height: calc(100% - 70px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .yellow-card {
            background: #FFD700;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .yellow-card:hover {
            transform: scale(1.02);
        }

        .yellow-card h3 {
            color: #2E7D32;
            margin-bottom: 5px;
        }

        /* LAYER 3,4,5 */
        .white-page {
            background: white;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .info-card {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #2E7D32;
        }

        .info-card h3 {
            color: #2E7D32;
            margin-bottom: 10px;
        }

        .gray-bg {
            background: #808080;
        }

        /* TANAMAN */
        .tanaman-page {
            background: #f0f0f0;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        .tanaman-header {
            background: white;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .tanaman-header h2 {
            color: #8B4513;
        }

        .tanaman-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .tanaman-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tanaman-card strong {
            color: #2E7D32;
        }

        .add-btn {
            background: #4CAF50;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            color: black;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .save-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* DETAIL TANAMAN */
        .detail-container {
            background: #8B4513;
            min-height: 100%;
            padding-bottom: 20px;
        }

        .detail-header {
            background: #8B4513;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid black;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .detail-header h2 {
            color: red;
            flex: 1;
            font-size: 16px;
        }

        .info-card-green {
            background: #2E7D32;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-card-green h3 {
            color: white;
            margin-bottom: 10px;
        }

        .info-card-green p {
            color: black;
            font-weight: bold;
        }

        .task-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .task-item label {
            flex: 1;
            cursor: pointer;
        }

        .task-item.completed label {
            text-decoration: line-through;
            color: #999;
        }

        .task-warning {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            color: #856404;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* CATATAN */
        .catatan-page {
            background: white;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        .catatan-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .catatan-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .catatan-preview {
            color: #666;
            font-size: 12px;
        }

        .fab-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
            font-size: 28px;
            color: white;
            border: none;
        }

        /* LAYER 8 EDITOR */
        .editor-container {
            background: #2E7D32;
            min-height: 100%;
        }

        .editor-header {
            background: #B8E1FF;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid black;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .editor-header h2 {
            color: #8B4513;
            flex: 1;
            font-size: 16px;
        }

        .note-frame {
            border: 3px solid black;
            margin: 20px;
            background: #2E7D32;
            padding: 15px;
        }

        .note-judul {
            background: #B8E1FF;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .note-judul input {
            width: 100%;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: bold;
        }

        .note-isi {
            min-height: 300px;
            background: #8B4513;
            padding: 15px;
            border-radius: 8px;
        }

        .note-isi [contenteditable="true"] {
            background: #8B4513;
            color: white;
            min-height: 250px;
            outline: none;
        }

        .editor-toolbar-bottom {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            margin: 15px;
            justify-content: center;
        }

        .tool-btn {
            padding: 10px 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .tool-btn-group {
            display: flex;
            gap: 5px;
        }

        .bg-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px;
        }

        .bg-option {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .bg-option.selected {
            border-color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="pages-container" id="themeContainer">
            <!-- HOME PAGE -->
            <div id="home-page" class="page active">
                <div class="home-header">
                    <h1>PertanianKu</h1>
                    <div class="tutorial-icon" onclick="showTutorial()">?</div>
                </div>
                <div class="home-middle">
                    <div class="features-container">
                        <button class="feature-btn" onclick="showPage('layer1')">🧮 Kalkulator</button>
                        <button class="feature-btn" onclick="showPage('layer2')">🌱 Pemupukan dan Obat Hama</button>
                        <button class="feature-btn" onclick="showPage('layer5')">🌿 Kenali Tanaman Anda</button>
                    </div>
                </div>
                <div class="bottom-nav">
                    <div class="nav-item active" onclick="navigateTo('home')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></div>
                    <div class="nav-item" onclick="navigateTo('tanaman')"><span class="nav-icon">🌿</span><span class="nav-label">Tanaman</span></div>
                    <div class="nav-item" onclick="navigateTo('catatan')"><span class="nav-icon">📝</span><span class="nav-label">Catatan</span></div>
                </div>
            </div>

            <!-- LAYER 1 KALKULATOR -->
            <div id="layer1-page" class="page">
                <div class="calculator-container">
                    <div class="calculator-header">
                        <button class="close-btn" onclick="showPage('home')">✕</button>
                        <h2>Kalkulator</h2>
                    </div>
                    <div class="scroll-area">
                        <div class="calculator-screen">
                            <div class="history-input" id="calcHistory"></div>
                            <div class="current-input" id="calcDisplay">0</div>
                        </div>
                        <div class="calculator-buttons">
                            <button class="calc-btn function" onclick="calcClear()">AC</button>
                            <button class="calc-btn function" onclick="calcDelete()">C</button>
                            <button class="calc-btn operator" onclick="calcOperatorClick('/')">÷</button>
                            <button class="calc-btn operator" onclick="calcOperatorClick('*')">×</button>
                            <button class="calc-btn" onclick="calcNumberClick('7')">7</button>
                            <button class="calc-btn" onclick="calcNumberClick('8')">8</button>
                            <button class="calc-btn" onclick="calcNumberClick('9')">9</button>
                            <button class="calc-btn operator" onclick="calcOperatorClick('-')">-</button>
                            <button class="calc-btn" onclick="calcNumberClick('4')">4</button>
                            <button class="calc-btn" onclick="calcNumberClick('5')">5</button>
                            <button class="calc-btn" onclick="calcNumberClick('6')">6</button>
                            <button class="calc-btn operator" onclick="calcOperatorClick('+')">+</button>
                            <button class="calc-btn" onclick="calcNumberClick('1')">1</button>
                            <button class="calc-btn" onclick="calcNumberClick('2')">2</button>
                            <button class="calc-btn" onclick="calcNumberClick('3')">3</button>
                            <button class="calc-bt
